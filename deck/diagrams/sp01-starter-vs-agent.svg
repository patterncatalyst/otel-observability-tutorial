<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620"><defs><marker id="_arrow_danger_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker><marker id="_arrow_platform_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">The starter does not survive Boot 4</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Same JVM, same application, two different attach mechanisms.</text><rect x="60" y="110" width="540" height="460" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="330" y="140" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15" font-weight="bold" fill="#B71C1C" text-anchor="middle">opentelemetry-spring-boot-starter</text><rect x="100" y="180" width="460" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Built for Boot 3.x</text><text x="330.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jackson 2 autoconfig</text><text x="330.0" y="240" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jakarta EE 10 servlet contracts</text><line x1="330" y1="260" x2="330" y2="310" stroke="#B71C1C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_danger_1)"/><rect x="100" y="310" width="460" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="334" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Spring Boot 4.1.x</text><text x="330.0" y="354" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jackson 3 (tools.jackson)</text><text x="330.0" y="370" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Jakarta EE 11, Spring Framework 7</text><text x="330" y="430" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Classpath conflicts at startup —</text><text x="330" y="450" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">not a quiet wrong serializer.</text><text x="330" y="500" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">Do not use the starter on Boot 4.x.</text><rect x="640" y="110" width="540" height="460" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="910" y="140" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#006E6E" text-anchor="middle">-javaagent:opentelemetry-javaagent.jar</text><rect x="680" y="180" width="460" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Attached at the JVM level</text><text x="910.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">premain runs before Spring's main()</text><line x1="910" y1="260" x2="910" y2="310" stroke="#006E6E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_platform_1)"/><rect x="680" y="310" width="460" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="334" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Weaves bytecode as classes load</text><text x="910.0" y="354" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">DispatcherServlet, gRPC, JDBC, Kafka client</text><text x="910" y="430" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Operates below the framework layer —</text><text x="910" y="450" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">version-agnostic by construction.</text><text x="910" y="500" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="bold" fill="#006E6E" text-anchor="middle">Keeps working across a major Boot version.</text></svg>