<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620"><defs><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker></defs><rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">One trace_id, four signals</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Correlation is provisioning, not application code.</text><rect x="500" y="150" width="240" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="620.0" y="174" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">trace_id</text><text x="620.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">generated at the root span</text><text x="620.0" y="210" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">propagated through context</text><rect x="80" y="320" width="220" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="190.0" y="344" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Tempo</text><text x="190.0" y="364" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">tracesToLogsV2</text><text x="190.0" y="380" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">tracesToMetrics</text><rect x="340" y="320" width="220" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="450.0" y="344" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Loki</text><text x="450.0" y="364" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">derived field:</text><text x="450.0" y="380" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">trace_id -&gt; Tempo</text><rect x="600" y="320" width="220" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="710.0" y="344" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Mimir</text><text x="710.0" y="364" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">exemplar -&gt;</text><text x="710.0" y="380" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">trace_id -&gt; Tempo</text><rect x="860" y="320" width="220" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="970.0" y="344" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Pyroscope</text><text x="970.0" y="364" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">tracesToProfiles</text><text x="970.0" y="380" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">by service + time range</text><line x1="560" y1="240" x2="190" y2="320" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><line x1="590" y1="240" x2="450" y2="320" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><line x1="650" y1="240" x2="710" y2="320" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><line x1="680" y1="240" x2="970" y2="320" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><rect x="140" y="460" width="900" height="110" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="590" y="495" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="middle">One click in Grafana: a slow span -&gt; its logs -&gt; its error -&gt;</text><text x="590" y="518" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="middle">its flame graph. Four queries, four stores, one shared identifier.</text></svg>