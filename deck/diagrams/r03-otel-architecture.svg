<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1280" height="640" fill="#FFFFFF"/><text x="640.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">API, SDK, and the Collector</text><text x="640.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One span's path from instrumentation to a backend.</text><rect x="40" y="150" width="190" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="135.0" y="174" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Instrumentation</text><text x="135.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">calls the API</text><text x="135.0" y="210" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">zero-code or code-based</text><rect x="270" y="150" width="190" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="365.0" y="174" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">API</text><text x="365.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no-op until an SDK</text><text x="365.0" y="210" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">is configured</text><rect x="500" y="150" width="190" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="595.0" y="174" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">SDK</text><text x="595.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Resource, sampler,</text><text x="595.0" y="210" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">processors</text><line x1="230" y1="195" x2="270" y2="195" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="460" y1="195" x2="500" y2="195" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="595" y1="240" x2="595" y2="300" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="595.0" y="264.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">OTLP</text><rect x="540" y="300" width="130" height="22" rx="11" ry="11" fill="#006E6E"/><text x="605.0" y="315" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">gRPC :4317</text><rect x="690" y="300" width="130" height="22" rx="11" ry="11" fill="#006E6E"/><text x="755.0" y="315" font-family="Red Hat Mono, Menlo, monospace" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">HTTP :4318</text><rect x="430" y="350" width="330" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="595.0" y="374" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Collector</text><text x="595.0" y="394" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">receive -&gt; process -&gt; export</text><text x="595.0" y="410" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">vendor-neutral relay</text><line x1="595" y1="340" x2="595" y2="350" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="595" y1="440" x2="595" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="300" y="500" width="170" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="385.0" y="524" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Tempo</text><text x="385.0" y="544" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">traces</text><rect x="500" y="500" width="170" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="585.0" y="524" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Mimir</text><text x="585.0" y="544" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">metrics</text><rect x="700" y="500" width="170" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="785.0" y="524" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Loki</text><text x="785.0" y="544" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">logs</text><line x1="595" y1="440" x2="385" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="595" y1="440" x2="785" y2="500" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="850" y="150" width="380" height="180" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="1040" y="180" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">service.name, service.version,</text><text x="1040" y="200" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">deployment.environment: the</text><text x="1040" y="220" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">Resource attached once per SDK,</text><text x="1040" y="240" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">carried on every span, metric,</text><text x="1040" y="260" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">and log that process emits.</text><text x="1040" y="295" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="bold" fill="#EE0000" text-anchor="middle">This is &quot;who emitted this.&quot;</text></svg>