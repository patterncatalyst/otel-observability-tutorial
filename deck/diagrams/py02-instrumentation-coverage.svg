<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"><rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Zero-code stops at the async boundary</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">This stack is asyncio throughout — the gap is a property of the libraries, not an oversight.</text><rect x="50" y="110" width="520" height="440" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="310" y="140" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16" font-weight="bold" fill="#006E6E" text-anchor="middle">Zero-code covers</text><rect x="90" y="170" width="440" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="310.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">FastAPI (HTTP)</text><text x="310.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">instrument_fastapi(app) binds the live app object</text><text x="310.0" y="230" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">request/response spans, no app code changes</text><rect x="90" y="280" width="440" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="310.0" y="304" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Synchronous libraries, generally</text><text x="310.0" y="324" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">the well-trodden, widely-used paths</text><text x="310.0" y="340" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">the zero-code model's actual target</text><text x="310" y="500" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Negligible startup cost — mostly import-time</text><text x="310" y="520" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">monkey-patching, not bytecode rewriting.</text><rect x="670" y="110" width="520" height="440" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="930" y="140" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B71C1C" text-anchor="middle">Manual work fills the gap</text><rect x="710" y="170" width="440" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="930.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">grpc.aio client/server</text><text x="930.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">GrpcAioInstrumentorClient/Server()</text><text x="930.0" y="230" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">the generic grpc hook only wires sync grpc</text><rect x="710" y="250" width="440" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="930.0" y="274" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">asyncpg</text><text x="930.0" y="294" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">AsyncPGInstrumentor()</text><text x="930.0" y="310" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">registered once in obs/otel.py</text><rect x="710" y="330" width="440" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="930.0" y="354" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Strawberry GraphQL resolvers</text><text x="930.0" y="374" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">review.resolve_reviews / resolve_review / add_review</text><text x="930.0" y="390" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">nested under one auto POST /graphql span</text><rect x="710" y="410" width="440" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="930.0" y="434" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">aiokafka</text><text x="930.0" y="454" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">inject_headers() / extract_context()</text><text x="930.0" y="470" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no instrumentor exists for this client at all</text></svg>