<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"><defs><marker id="_arrow_danger_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker><marker id="_arrow_platform_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Two flags that look alike</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One deletes the span category at build time; the other only stops header injection at runtime.</text><rect x="60" y="110" width="1120" height="200" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="620" y="138" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">quarkus.otel.instrument.messaging — BUILD-TIME</text><rect x="100" y="160" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="250.0" y="184" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">=false at build</text><text x="250.0" y="204" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">compiled with no messaging</text><text x="250.0" y="220" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">instrumentation at all</text><line x1="400" y1="215" x2="480" y2="215" stroke="#B71C1C" stroke-width="1.6" marker-end="url(#_arrow_danger_0)"/><rect x="480" y="160" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="630.0" y="184" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">No consumer span</text><text x="630.0" y="204" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">the contrast this chapter needs</text><text x="630.0" y="220" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">is gone — nothing to compare</text><text x="1000" y="215" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#B71C1C" text-anchor="middle">Not used for the
demo toggle.</text><rect x="60" y="340" width="1120" height="220" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="620" y="368" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="bold" fill="#006E6E" text-anchor="middle">mp.messaging.outgoing.*.tracing-enabled — RUNTIME, PER CHANNEL</text><rect x="100" y="390" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="250.0" y="414" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">=${PROPAGATE_KAFKA_CONTEXT}</text><text x="250.0" y="434" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">producer-side header</text><text x="250.0" y="450" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">injection only</text><line x1="400" y1="445" x2="480" y2="445" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><rect x="480" y="390" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="630.0" y="414" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Consumer span still opens</text><text x="630.0" y="434" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">true: continues the trace</text><text x="630.0" y="450" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">false: starts a new root</text><line x1="780" y1="445" x2="860" y2="445" stroke="#006E6E" stroke-width="1.6" marker-end="url(#_arrow_platform_0)"/><rect x="860" y="390" width="300" height="110" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1010.0" y="414" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">One trace, or two</text><text x="1010.0" y="434" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">the exact contrast</text><text x="1010.0" y="450" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">PROPAGATE_KAFKA_CONTEXT shows</text></svg>