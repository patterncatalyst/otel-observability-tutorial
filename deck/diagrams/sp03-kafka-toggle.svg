<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"><defs><marker id="_arrow_danger_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker><marker id="_arrow_platform_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">PROPAGATE_KAFKA_CONTEXT: continue or break</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A producer-side-only switch, read as a JVM system property.</text><rect x="60" y="120" width="540" height="420" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="330" y="150" font-family="Red Hat Mono, Menlo, monospace" font-size="18" font-weight="bold" fill="#B71C1C" text-anchor="middle">false</text><rect x="100" y="190" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="214" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">KafkaTemplate.send()</text><text x="330.0" y="234" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">producer-propagation.enabled=false</text><line x1="330" y1="260" x2="330" y2="310" stroke="#B71C1C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_danger_1)"/><rect x="100" y="310" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="334" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">@KafkaListener opens a NEW root span</text><text x="330.0" y="354" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">no traceparent header to extract</text><text x="330" y="420" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Two separate trace IDs in Tempo,</text><text x="330" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">related only by order_id in the payload.</text><text x="330" y="490" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B71C1C" text-anchor="middle">The consumer span still exists — only the link is gone.</text><rect x="640" y="120" width="540" height="420" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="910" y="150" font-family="Red Hat Mono, Menlo, monospace" font-size="18" font-weight="bold" fill="#006E6E" text-anchor="middle">true (default)</text><rect x="680" y="190" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="214" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">KafkaTemplate.send()</text><text x="910.0" y="234" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">agent injects traceparent + baggage headers</text><line x1="910" y1="260" x2="910" y2="310" stroke="#006E6E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_platform_1)"/><text x="910.0" y="279.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">headers</text><rect x="680" y="310" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="334" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">@KafkaListener continues the trace</text><text x="910.0" y="354" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">extracted header becomes the parent span</text><text x="910" y="420" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">One trace ID across the REST request</text><text x="910" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">and both the shipping and notification hops.</text><text x="910" y="490" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#006E6E" text-anchor="middle">entrypoint.sh translates the env var into a -D flag.</text></svg>