<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560"><defs><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker></defs><rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Three attach mechanisms, one trace shape</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Python's zero-code path is a launcher wrapping the process, not an agent inside it.</text><rect x="40" y="110" width="360" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="220.0" y="134" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Java agent</text><text x="220.0" y="154" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">-javaagent flag</text><text x="220.0" y="170" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">bytecode woven at class-load</text><text x="220.0" y="186" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Spring Boot</text><rect x="440" y="110" width="360" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="620.0" y="134" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Build-time extension</text><text x="620.0" y="154" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">quarkus-opentelemetry</text><text x="620.0" y="170" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">instrumentation baked into the jar</text><text x="620.0" y="186" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Quarkus</text><rect x="840" y="110" width="360" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="1020.0" y="134" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Zero-code launcher</text><text x="1020.0" y="154" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">opentelemetry-instrument</text><text x="1020.0" y="170" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">wraps the process at exec time</text><text x="1020.0" y="186" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">Python</text><rect x="40" y="270" width="1160" height="250" rx="8" ry="8" fill="#FFF8F0" stroke="#EE0000" stroke-width="1"/><text x="620" y="300" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="15" font-weight="bold" fill="#EE0000" text-anchor="middle">opentelemetry-instrument, step by step</text><rect x="80" y="330" width="260" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="210.0" y="354" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">ENTRYPOINT</text><text x="210.0" y="374" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">opentelemetry-instrument</text><text x="210.0" y="390" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">starts before anything else</text><line x1="340" y1="380" x2="440" y2="380" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="390.0" y="374.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">discovers + patches</text><rect x="440" y="330" width="300" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="590.0" y="354" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Instrumentation packages</text><text x="590.0" y="374" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">fastapi, grpc, asyncpg</text><text x="590.0" y="390" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">target modules monkey-patched</text><line x1="740" y1="380" x2="820" y2="380" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="780.0" y="374.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">execs into</text><rect x="820" y="330" width="340" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="990.0" y="354" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">uvicorn order.main:app</text><text x="990.0" y="374" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">FastAPI app constructed</text><text x="990.0" y="390" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">already-patched, not patched after</text><text x="620" y="495" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Reverse the order (import first, instrument second) and some patches never take effect.</text></svg>