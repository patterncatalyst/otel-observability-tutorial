<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"><defs><marker id="_arrow_danger_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker><marker id="_arrow_platform_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#006E6E"/></marker></defs><rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Head sampling vs. tail sampling</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Deciding blind at the start, or deciding informed at the end.</text><rect x="60" y="120" width="540" height="420" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="330" y="150" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16" font-weight="bold" fill="#B71C1C" text-anchor="middle">Head sampling</text><rect x="100" y="180" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">SDK flips a coin</text><text x="330.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">at the root span, before the outcome is known</text><line x1="330" y1="250" x2="330" y2="300" stroke="#B71C1C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_danger_1)"/><rect x="100" y="300" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="324" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">~10% exported</text><text x="330.0" y="344" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">cheap, but losses are random</text><text x="330" y="420" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A slow, failing request is exactly as likely</text><text x="330" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">to be discarded as a fast, healthy one.</text><text x="330" y="490" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B71C1C" text-anchor="middle">Cost: known and fixed. Loss: blind.</text><rect x="640" y="120" width="540" height="420" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="910" y="150" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="16" font-weight="bold" fill="#006E6E" text-anchor="middle">Tail sampling</text><rect x="680" y="180" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Collector buffers the whole trace</text><text x="910.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">decision_wait, then evaluate policies</text><line x1="910" y1="250" x2="910" y2="300" stroke="#006E6E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_platform_1)"/><rect x="680" y="300" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="324" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Keep errors, keep slow, sample the rest</text><text x="910.0" y="344" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">informed by what actually happened</text><text x="910" y="420" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Costs Collector memory and buffering time,</text><text x="910" y="440" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">not traces you can never get back.</text><text x="910" y="490" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#006E6E" text-anchor="middle">Cost: Collector RAM. Loss: a deliberate choice.</text></svg>