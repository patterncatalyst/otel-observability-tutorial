<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620"><rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Monitoring vs. observability</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">A known threshold answers one question; a running system answers any question.</text><rect x="60" y="110" width="540" height="460" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="330" y="140" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="18" font-weight="bold" fill="#B71C1C" text-anchor="middle">Monitoring</text><rect x="100" y="170" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">CPU &gt; 90%</text><text x="330.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">threshold alert</text><rect x="100" y="260" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="284" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Error rate &gt; 5%</text><text x="330.0" y="304" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">threshold alert</text><rect x="100" y="350" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="330.0" y="374" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Disk nearly full</text><text x="330.0" y="394" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">threshold alert</text><text x="330" y="460" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Answers questions named in advance</text><text x="330" y="485" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">(known-unknowns)</text><text x="330" y="540" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#B71C1C" text-anchor="middle">Checkout is slow for a slice of customers.</text><text x="330" y="560" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#B71C1C" text-anchor="middle">Every dashboard is green. No alert fired.</text><rect x="640" y="110" width="540" height="460" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="910" y="140" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="18" font-weight="bold" fill="#006E6E" text-anchor="middle">Observability</text><rect x="680" y="170" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Trace</text><text x="910.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">one request's shape, span by span</text><rect x="680" y="260" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="284" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Metric exemplar</text><text x="910.0" y="304" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">this spike, this one sample</text><rect x="680" y="350" width="460" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="910.0" y="374" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Correlated logs</text><text x="910.0" y="394" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same trace_id, same window</text><text x="910" y="460" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Answers a question built on the spot</text><text x="910" y="485" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5A5A5A" text-anchor="middle">(unknown-unknowns)</text><text x="910" y="540" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#006E6E" text-anchor="middle">Filter by payment.provider and retry.count,</text><text x="910" y="560" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#006E6E" text-anchor="middle">a slice nobody dashboarded for in advance.</text></svg>