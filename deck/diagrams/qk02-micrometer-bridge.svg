<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker></defs><rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/><text x="620.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">One Micrometer call, two bridges</text><text x="620.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">meterRegistry.counter(...) is identical code; what happens to its output differs.</text><rect x="90" y="150" width="300" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#4A4A4A" stroke-width="1.6"/><text x="240.0" y="174" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Application code</text><text x="240.0" y="194" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">meterRegistry.counter(&quot;orders_placed_total&quot;)</text><text x="240.0" y="210" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">.increment()</text><line x1="390" y1="170" x2="460" y2="170" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="390" y1="215" x2="460" y2="320" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="460" y="120" width="320" height="140" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="620" y="145" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#B71C1C" text-anchor="middle">Spring: runtime bridge</text><rect x="480" y="165" width="280" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="620.0" y="189" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Java agent</text><text x="620.0" y="209" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">watches MeterRegistry beans,</text><text x="620.0" y="225" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">mirrors meters onto the OTel SDK</text><rect x="460" y="280" width="320" height="140" rx="8" ry="8" fill="#F2FBF9" stroke="#006E6E" stroke-width="1"/><text x="620" y="305" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="bold" fill="#006E6E" text-anchor="middle">Quarkus: build-time bridge</text><rect x="480" y="325" width="280" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="620.0" y="349" font-family="Red Hat Mono, Menlo, monospace" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">quarkus-micrometer-opentelemetry</text><text x="620.0" y="369" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">wired onto the OTel exporter</text><text x="620.0" y="385" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">as part of the Quarkus build</text><line x1="760" y1="200" x2="880" y2="240" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="760" y1="360" x2="880" y2="260" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="880" y="210" width="280" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="1020.0" y="234" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">OpenTelemetry SDK</text><text x="1020.0" y="254" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">one histogram, one counter,</text><text x="1020.0" y="270" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">exemplars attached</text><line x1="1020" y1="300" x2="1020" y2="360" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><text x="1020.0" y="324.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">OTLP</text><rect x="900" y="360" width="240" height="70" rx="8" ry="8" fill="#FFFFFF" stroke="#6A1B9A" stroke-width="1.6"/><text x="1020.0" y="384" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Mimir</text><text x="1020.0" y="404" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">same PromQL either way</text><rect x="90" y="280" width="320" height="180" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="250" y="310" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="bold" fill="#4A4A4A" text-anchor="middle">Mimir cannot tell which bridge</text><text x="250" y="332" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">produced a given histogram —</text><text x="250" y="354" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">by the time it is OTLP on the wire,</text><text x="250" y="376" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">the bridge has already run and</text><text x="250" y="398" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#4A4A4A" text-anchor="middle">disappeared.</text></svg>