<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640"><defs><marker id="_arrow_neutral_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#4A4A4A"/></marker><marker id="_arrow_rest_0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EE0000"/></marker><marker id="_arrow_govern_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B36B00"/></marker></defs><rect x="0" y="0" width="1280" height="640" fill="#FFFFFF"/><text x="640.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">One jar, four boundaries, zero application code</text><text x="640.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">The javaagent instruments bytecode below the framework, then exports over OTLP.</text><rect x="40" y="180" width="190" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="135.0" y="204" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">-javaagent attach</text><text x="135.0" y="224" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">premain, before Spring's main()</text><line x1="230" y1="225" x2="290" y2="225" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="290" y="130" width="330" height="260" rx="8" ry="8" fill="#FFFFFF" stroke="#0066CC" stroke-width="1.6"/><text x="455.0" y="154" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Spring Boot process</text><text x="455.0" y="174" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">DispatcherServlet  -&gt;  HTTP spans</text><text x="455.0" y="190" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">gRPC ManagedChannel/Server  -&gt;  RPC spans</text><text x="455.0" y="206" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">JDBC Driver  -&gt;  DB spans</text><text x="455.0" y="222" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">KafkaTemplate / @KafkaListener  -&gt;  messaging spans</text><line x1="620" y1="190" x2="680" y2="160" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="650.0" y="169.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">bridges</text><rect x="680" y="120" width="260" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="810.0" y="144" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Micrometer MeterRegistry</text><text x="810.0" y="164" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">any bean, mirrored to OTel metrics</text><line x1="620" y1="260" x2="680" y2="260" stroke="#EE0000" stroke-width="1.6" marker-end="url(#_arrow_rest_0)"/><text x="650.0" y="254.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">injects</text><rect x="680" y="220" width="260" height="80" rx="8" ry="8" fill="#FFFFFF" stroke="#EE0000" stroke-width="1.6"/><text x="810.0" y="244" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Logback MDC</text><text x="810.0" y="264" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">trace_id / span_id / trace_flags</text><line x1="940" y1="160" x2="1000" y2="200" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><line x1="940" y1="260" x2="1000" y2="220" stroke="#4A4A4A" stroke-width="1.6" marker-end="url(#_arrow_neutral_0)"/><rect x="1000" y="170" width="230" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="1115.0" y="194" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">OTLP exporter</text><text x="1115.0" y="214" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">traces + metrics + logs</text><text x="1115.0" y="230" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">one SDK, one export path</text><rect x="290" y="420" width="940" height="150" rx="8" ry="8" fill="#F4F4F4" stroke="#D2D2D2" stroke-width="1"/><text x="760" y="450" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="middle">OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_EXPORTER_OTLP_PROTOCOL,</text><text x="760" y="472" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#4A4A4A" text-anchor="middle">OTEL_SERVICE_NAME, OTEL_PROPAGATORS — read directly from the environment.</text><text x="760" y="500" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="12" font-weight="normal" fill="#5A5A5A" text-anchor="middle">No Spring configuration file is involved: application.properties is unaware tracing exists.</text><line x1="760" y1="420" x2="760" y2="390" stroke="#B36B00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_govern_1)"/><text x="760.0" y="399.0" font-family="Red Hat Text, Arial, sans-serif" font-size="11" fill="#5A5A5A" text-anchor="middle">configures</text><line x1="135" y1="420" x2="135" y2="270" stroke="#B36B00" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_govern_1)"/></svg>