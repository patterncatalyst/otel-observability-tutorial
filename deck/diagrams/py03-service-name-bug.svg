<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600"><defs><marker id="_arrow_danger_1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B71C1C"/></marker></defs><rect x="0" y="0" width="1200" height="600" fill="#FFFFFF"/><text x="600.0" y="36" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="22" font-weight="bold" fill="#4A4A4A" text-anchor="middle">One resource, two names</text><text x="600.0" y="64" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5A5A5A" text-anchor="middle">Verified in this tutorial's Python services: a Resource built from the wrong source breaks correlation silently.</text><rect x="80" y="130" width="460" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="310.0" y="154" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Traces (Tempo)</text><text x="310.0" y="174" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">service.name = order-python</text><text x="310.0" y="190" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">from OTEL_SERVICE_NAME</text><rect x="660" y="130" width="460" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#006E6E" stroke-width="1.6"/><text x="890.0" y="154" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Metrics (Mimir)</text><text x="890.0" y="174" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">service.name = order-python</text><text x="890.0" y="190" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">from OTEL_SERVICE_NAME</text><rect x="80" y="400" width="460" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="310.0" y="424" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Logs (Loki)</text><text x="310.0" y="444" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">service.name = order</text><text x="310.0" y="460" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">bare function argument</text><rect x="660" y="400" width="460" height="100" rx="8" ry="8" fill="#FFFFFF" stroke="#B71C1C" stroke-width="1.6"/><text x="890.0" y="424" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="14" font-weight="600" fill="#4A4A4A" text-anchor="middle">Profiles (Pyroscope)</text><text x="890.0" y="444" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">service.name = order</text><text x="890.0" y="460" font-family="Red Hat Text, Arial, sans-serif" font-size="12" fill="#5A5A5A" text-anchor="middle">bare function argument</text><line x1="310" y1="230" x2="310" y2="400" stroke="#B71C1C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_danger_1)"/><line x1="890" y1="230" x2="890" y2="400" stroke="#B71C1C" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#_arrow_danger_1)"/><text x="230" y="255" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#B71C1C" text-anchor="start">no match</text><text x="810" y="255" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="11" font-weight="normal" fill="#B71C1C" text-anchor="start">no match</text><rect x="60" y="300" width="1080" height="60" rx="8" ry="8" fill="#FFF5F5" stroke="#B71C1C" stroke-width="1"/><text x="600" y="335" font-family="Overpass, Red Hat Text, Arial, sans-serif" font-size="13" font-weight="normal" fill="#B71C1C" text-anchor="middle">Nothing crashed. Nothing logged an error.</text><rect x="260" y="520" width="680" height="60" rx="6" ry="6" fill="#151515"/><text x="272" y="542" font-family="Red Hat Mono, Menlo, monospace" font-size="11" fill="#8FB98F"># the fix — resolve OTEL_SERVICE_NAME before building any Resource</text><text x="272" y="558" font-family="Red Hat Mono, Menlo, monospace" font-size="11" fill="#E6E6E6">cfg = ObsConfig(service_name=os.getenv(&quot;OTEL_SERVICE_NAME&quot;) or service_name)</text></svg>