  # --- shipping (Kafka consumer of order.placed) ----------------------------
  shipping-spring:
    profiles: ["spring"]
    build:
      context: ../services/spring/shipping
      dockerfile: Containerfile
    image: localhost/otel-tutorial-shipping-spring:dev
