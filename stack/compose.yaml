  # --- payment (gRPC, internal :50052) --------------------------------------
  payment-spring:
    profiles: ["spring"]
    build:
      context: ../services/spring/payment
      dockerfile: Containerfile
    image: localhost/otel-tutorial-payment-spring:dev
    environment:
