# values.yaml — the knobs for deploying the tutorial's shared stack and
# domain services to OpenShift.
#
# The six domain services are described declaratively in `services` below;
# templates/app-deployment.yaml, app-service.yaml, and app-route.yaml range
# over this map, so the whole topology is one template driven by data —
# the same idiom stack/compose.yaml uses with its per-language `profiles`
# and the `x-service-env` anchor.
#
# SCOPE: this chart deploys one language track at a time (`language:`
# below), matching stack/compose.yaml's `--profile spring|quarkus|python`
# switch. All three tracks have been deployed and verified on a live CRC
# cluster (see _docs/25-appendix-openshift-crc.md); `python` is the default.
# The Deployment/Service/Route shape and the env contract are the same for
# every track, and the SCC story is too: the python images run as
# `USER 1001:0` and the spring/quarkus images as `USER 185:0`, both
# arbitrary-UID, group-zero and restricted-v2-compatible. The per-language
# probe path (healthPathByLanguage: python /health, spring/quarkus
# /actuator/health), the writable /deployments/logs mount the JVM tracks need,
# and the Postgres `password` (read directly by the spring/quarkus datasources,
# not just via DATABASE_URL) are the settings that have to vary or hold across
# tracks — they live in this file so the `--set language=` swap is all a
# reader runs.
language: python

# Container image settings. On OpenShift the natural home is the integrated
# registry; `openshift/build-and-push.sh` builds each
# services/<language>/<domain>/Containerfile and pushes it there under the
# exact ref this template composes:
#   <registry>/otel-tutorial-<domain>-<language>:<tag>
# Override `registry` to point at an external registry (Quay, etc.) instead.
image:
  registry: "image-registry.openshift-image-registry.svc:5000/otel-observability"
  tag: "v1"
  pullPolicy: IfNotPresent

# Dev-only Postgres credential, rendered into a Secret (templates/secret-db.yaml)
# as a single DATABASE_URL DSN — the same env var name and connection-string
# shape stack/compose.yaml's `x-service-env` anchor uses, so no application
# code changes between compose and this chart. The password must match what
# stack/compose.yaml seeds (`apppass`): the python services read it from the
# DATABASE_URL DSN, but the spring and quarkus services take the same
# credential from their hardcoded `spring.datasource.password` /
# `quarkus.datasource.password` (both `apppass`), so a divergent value here
# authenticates the python track yet leaves the two JVM tracks unable to reach
# Postgres and stuck DOWN on their health check.
# PRODUCTION: replace with a SealedSecret / ExternalSecret — never plaintext
# Postgres credentials committed to a values file.
postgres:
  username: "appuser"
  password: "apppass"
  database: "appdb"
  image: "docker.io/library/postgres:17-alpine"
  storage: "2Gi"

kafka:
  image: "docker.io/apache/kafka:4.2.2"
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
  storage: "2Gi"

# The grafana/otel-lgtm all-in-one image: OTel Collector + Tempo + Loki +
# Mimir + Grafana in one container, pinned to the same tag
# stack/compose.yaml runs locally.
lgtm:
  image: "docker.io/grafana/otel-lgtm:0.35.0"

# Grafana Pyroscope — the fourth signal (continuous profiling), same image
# stack/compose.yaml runs locally. No PVC: the compose stack doesn't persist
# profile data across restarts either, so this chart keeps that ephemeral
# behavior rather than adding storage compose doesn't have.
#
# runAsUser is the UID the pyroscope image's own `pyroscope` account is built
# with (10001). The image's metastore writes under /data, a directory that
# account owns; restricted-v2's randomly assigned namespace UID cannot create
# /data/v2 there, so the pod must run as its own UID. Because 10001 falls
# outside the namespace's assigned range, requesting it forces admission onto
# the `anyuid` SCC (see pyroscopeServiceAccountName below) — the same
# mechanism lgtm uses, scoped to this one pod.
pyroscope:
  image: "docker.io/grafana/pyroscope:2.3.2"
  runAsUser: 10001

# Pyroscope runs under its own ServiceAccount bound to `anyuid` so it can keep
# the fixed UID its image's data directory is owned by (see pyroscope.runAsUser
# above and templates/pyroscope-deployment.yaml). Scoped to this one pod, not
# a namespace-wide grant — the same pattern as lgtmServiceAccountName.
pyroscopeServiceAccountName: "otel-observability-pyroscope"

# ServiceAccount for the infra StatefulSets (postgres, kafka). Their upstream
# images require specific non-root UIDs (postgres 70, kafka 1000), which
# OpenShift's default `restricted-v2` SCC will not allow — it assigns a
# random UID from the namespace range instead. Binding this SA to
# `nonroot-v2` lets those two pods keep their own UID. The six app pods need
# no such grant: the app images already run as `USER 1001:0` (arbitrary UID,
# group 0), which is exactly what restricted-v2 expects. Pyroscope is the
# exception among the non-app pods — its image writes /data as a fixed UID
# restricted-v2 won't allow, so it runs under its own anyuid-bound
# ServiceAccount (see pyroscopeServiceAccountName below), the same way lgtm
# does.
infra:
  serviceAccountName: "otel-observability-infra"
  scc: "nonroot-v2"

# The grafana/otel-lgtm image's bundled Grafana/Tempo/Loki/Mimir run as the
# image's own (effectively root) user and write to directories it owns;
# under restricted-v2's randomly assigned UID, Grafana can never write its
# data dir and never binds :3000. Bind a dedicated SA to the `anyuid` SCC so
# this one pod runs as the image's intended UID — scoped to this single
# backend, not a namespace-wide grant. (Same finding, same fix, as the
# datamesh-reference-arch-python OpenShift appendix's `lgtm` ServiceAccount.)
lgtmServiceAccountName: "otel-observability-lgtm"

# HTTP readiness/liveness path, selected by language. This is the one place
# the three tracks genuinely diverge: the python services expose /health (the
# FastAPI convention), while spring serves health through Actuator and quarkus
# remaps SmallRye Health, both at /actuator/health. There is no single path all
# three answer — python's order happens to expose both, but python's review
# only serves /health — so the probe path is chosen per language rather than
# hardcoded per service. templates/app-deployment.yaml indexes this map with
# `.Values.language` for the two HTTP services' probes.
healthPathByLanguage:
  python: /health
  spring: /actuator/health
  quarkus: /actuator/health

# The six domain services, described as data. `probe` selects the readiness/
# liveness shape: "http" for the two services with REST/GraphQL ports,
# "grpc" for the two internal gRPC services, "none" for the two Kafka-only
# workers (shipping, notification) that expose no port at all — mirrors
# shipping/notification's Containerfiles, which have no EXPOSE and no health
# route (see services/python/shipping/Containerfile,
# services/python/notification/Containerfile).
services:
  order:
    port: 8080
    probe: http
    route: true
    # order calls inventory and payment over gRPC — see INVENTORY_ADDR/
    # PAYMENT_ADDR wiring in templates/app-deployment.yaml.
    callsInventoryPayment: true
  review:
    port: 8081
    probe: http
    route: true
  inventory:
    port: 50051
    probe: grpc
  payment:
    port: 50052
    probe: grpc
  shipping:
    probe: none
    kafka: true
  notification:
    probe: none
    kafka: true

# Resource requests/limits for the six app Deployments. One tier is enough
# for a tutorial-scale demo; split further if a given service turns out to
# need more under load. The memory request is set below the JVM tracks' actual
# footprint on purpose: on a single-node 16 GB CRC VM the sum of six app
# requests plus the lgtm/pyroscope/postgres/kafka infra has to leave the node
# schedulable, and scheduling reserves the request, not the limit. The 512Mi
# limit still gives the spring and quarkus JVMs (which run under two javaagents)
# the headroom they need; the python track stays well under the request.
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }

# Shared observability env, mirroring stack/compose.yaml's `x-service-env`
# anchor exactly by name: OTEL_EXPORTER_OTLP_ENDPOINT, KAFKA_BOOTSTRAP,
# PROPAGATE_KAFKA_CONTEXT, PYROSCOPE_ADDRESS. DATABASE_URL is deliberately
# NOT here — it is rendered into the Secret in templates/secret-db.yaml
# instead, since it carries the Postgres credential.
env:
  otlpProtocol: "http/protobuf"
  propagateKafkaContext: "true"
  deployEnv: "openshift-crc"
  serviceVersion: "v1"
