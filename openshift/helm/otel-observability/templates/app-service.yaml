{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "otel-observability.labels" $root | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: {{ if eq $svc.probe "http" }}http{{ else }}grpc{{ end }}
      port: {{ $svc.port }}
      targetPort: {{ if eq $svc.probe "http" }}http{{ else }}grpc{{ end }}
{{- end }}
{{- end }}
