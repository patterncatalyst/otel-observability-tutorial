# The infra StatefulSets (postgres, kafka) run under this ServiceAccount,
# which is granted the `nonroot-v2` SCC so their upstream images can keep the
# specific non-root UIDs they require (postgres 70, kafka 1000). OpenShift's
# default `restricted-v2` SCC would otherwise overwrite those with a random
# namespace UID and the images' data-dir ownership assumptions would break.
#
# The grant works by RoleBinding the SA to the cluster role OpenShift
# auto-generates for every SCC: `system:openshift:scc:<scc-name>`, whose
# single `use` permission on that SCC is what admission checks. CLI
# equivalent: `oc adm policy add-scc-to-user {{ .Values.infra.scc }} -z {{ .Values.infra.serviceAccountName }}`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.infra.serviceAccountName }}
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.infra.serviceAccountName }}-scc
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:{{ .Values.infra.scc }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.infra.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
# The grafana/otel-lgtm all-in-one image needs to run as its own (root) UID
# to write Grafana/Tempo/Loki/Mimir's data dirs — restricted-v2's randomly
# assigned UID forbids this (see lgtm-deployment.yaml). Scoped to this one
# backend pod, not a namespace-wide grant.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.lgtmServiceAccountName }}
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.lgtmServiceAccountName }}-anyuid
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.lgtmServiceAccountName }}
    namespace: {{ .Release.Namespace }}
---
# Pyroscope needs to run as its image's own fixed UID (pyroscope.runAsUser) to
# write the /data directory that UID owns — restricted-v2's randomly assigned
# namespace UID cannot create /data/v2 and the pod crashloops on
# "mkdir ./data/v2: permission denied". Binding this SA to `anyuid` lets the
# pod keep that UID. Scoped to this one pod, same pattern as the lgtm SA above.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.pyroscopeServiceAccountName }}
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.pyroscopeServiceAccountName }}-anyuid
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: {{ .Values.pyroscopeServiceAccountName }}
    namespace: {{ .Release.Namespace }}
