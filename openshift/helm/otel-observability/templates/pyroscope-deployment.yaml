# Grafana Pyroscope — the fourth signal (continuous profiling), same image
# and `server` command stack/compose.yaml runs locally. No PVC: compose
# doesn't persist profile data across restarts either (see
# stack/compose.yaml's comment on this service), so profile storage here is
# the container's own ephemeral filesystem, consistent with that.
#
# Pyroscope's image runs as its own `pyroscope` account (UID 10001) and writes
# its metastore under /data, a directory that UID owns. Under restricted-v2's
# randomly assigned namespace UID the pod cannot create /data/v2 and crashloops
# on "mkdir ./data/v2: permission denied" — confirmed on a live CRC cluster.
# The fix is the one lgtm-deployment.yaml already uses: a dedicated
# ServiceAccount bound to the `anyuid` SCC (templates/serviceaccount-infra.yaml)
# plus an explicit runAsUser, which both lets the pod keep UID 10001 and — since
# that UID is outside the namespace range — forces admission onto anyuid rather
# than restricted-v2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pyroscope
  labels:
    app.kubernetes.io/name: pyroscope
    {{- include "otel-observability.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyroscope
        {{- include "otel-observability.labels" . | nindent 8 }}
    spec:
      # See templates/serviceaccount-infra.yaml: this SA is granted anyuid so
      # the pod can keep its image's own UID and write /data.
      serviceAccountName: {{ .Values.pyroscopeServiceAccountName }}
      containers:
        - name: pyroscope
          image: {{ .Values.pyroscope.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["server"]
          ports:
            - name: http
              containerPort: 4040
          # No healthcheck in stack/compose.yaml either: this image is
          # distroless (no shell, no curl/wget), so there's no in-container
          # CMD to probe with, and its internal components can take up to
          # ~2 minutes to report ready on a cold start. A TCP probe at least
          # confirms the process is listening.
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            # Request the image's own UID. Do NOT add seccompProfile or
            # capabilities here: anyuid permits neither, and setting them makes
            # admission prefer restricted-v2 again, which reintroduces the
            # /data permission failure. Same constraint as lgtm-deployment.yaml.
            runAsUser: {{ .Values.pyroscope.runAsUser }}
