{{- $dns := include "otel-observability.dns" . -}}
# Dev-only Postgres credential, rendered as a complete DATABASE_URL DSN — the
# exact env var name and connection-string shape
# stack/compose.yaml's `x-service-env` anchor uses
# (postgres://appuser:apppass@postgres:5432/appdb), so no application code
# changes between compose and this chart, only the host changing from the
# compose service name to this chart's in-cluster Service DNS.
#
# PRODUCTION: replace with a SealedSecret (encrypted at rest in git) or an
# ExternalSecret (synced from a secret manager) — a plaintext Secret manifest
# built from values.yaml is never how real credentials ship.
apiVersion: v1
kind: Secret
metadata:
  name: otel-observability-db
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgres.username }}:{{ .Values.postgres.password }}@postgres.{{ $dns }}:5432/{{ .Values.postgres.database }}"
