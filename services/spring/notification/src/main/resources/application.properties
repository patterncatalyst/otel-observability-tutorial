spring.application.name=notification-spring
spring.main.web-application-type=none

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/appdb
spring.datasource.username=appuser
spring.datasource.password=apppass

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:kafka:9094}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Keep the JVM alive for this non-web service (gRPC/Kafka threads are daemon).
spring.main.keep-alive=true
