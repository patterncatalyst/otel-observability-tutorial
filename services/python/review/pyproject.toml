[project]
name = "review"
version = "0.1.0"
description = "Review service - GraphQL (Strawberry/FastAPI) for the OTel tutorial's Python implementation."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "strawberry-graphql==0.332.0",
    "asyncpg==0.32.0",
    # Unused directly by this service, but required to import the vendored
    # `obs` package, which (identically across all six services) eagerly
    # imports obs.kafka.
    "aiokafka==0.14.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "pyroscope-io==1.2.5",
]

[tool.uv]
package = false
