[project]
name = "order"
version = "0.1.0"
description = "Order service - REST front door (FastAPI) for the OTel tutorial's Python implementation."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "grpcio==1.84.0",
    "protobuf==7.36.2",
    "aiokafka==0.14.0",
    "asyncpg==0.32.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-grpc==0.66b1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "pyroscope-io==1.2.5",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.84.0",
]

[tool.uv]
# This is an application, not a library: skip building/installing it as a
# package. uv just resolves and locks the dependency set; the service runs
# via PYTHONPATH=/app/src (see the Containerfile), importing order/obs/shop
# as plain top-level packages.
package = false
