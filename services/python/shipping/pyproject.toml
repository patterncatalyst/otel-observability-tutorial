[project]
name = "shipping"
version = "0.1.0"
description = "Shipping service - Kafka consumer (aiokafka) for the OTel tutorial's Python implementation."
requires-python = ">=3.14"
dependencies = [
    "aiokafka==0.14.0",
    "asyncpg==0.32.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-instrumentation-asyncpg==0.66b1",
    "opentelemetry-instrumentation-logging==0.66b1",
    "pyroscope-io==1.2.5",
]

[tool.uv]
package = false
