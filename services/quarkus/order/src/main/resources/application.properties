quarkus.application.name=order-quarkus

quarkus.http.port=8080
# /actuator/health is what demos/drive-load.sh polls for readiness; remap the
# SmallRye Health aggregate endpoint onto that path instead of the default /q/health.
quarkus.smallrye-health.root-path=/actuator/health

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=appuser
quarkus.datasource.password=apppass
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/appdb
# Emit OTel JDBC client spans for the Postgres hop (needs quarkus-opentelemetry
# on the classpath; no separate extension required).
quarkus.datasource.jdbc.telemetry=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:kafka:9094}
mp.messaging.outgoing.order-placed-out.connector=smallrye-kafka
mp.messaging.outgoing.order-placed-out.topic=order.placed
mp.messaging.outgoing.order-placed-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.order-placed-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka trace-context propagation toggle (PROPAGATE_KAFKA_CONTEXT, default
# true): a runtime per-channel attribute on the producer side only. When
# false, this producer stops injecting traceparent/baggage headers, so
# shipping/notification's consumer spans start independent root traces
# instead of continuing this one. (quarkus.otel.instrument.messaging is a
# BUILD-TIME switch that deletes messaging spans entirely when false — not
# what we want here, so it is deliberately not used.)
mp.messaging.outgoing.order-placed-out.tracing-enabled=${PROPAGATE_KAFKA_CONTEXT:true}

# gRPC clients: entrypoint.sh splits INVENTORY_ADDR/PAYMENT_ADDR ("host:port")
# into *_HOST/*_PORT, since quarkus.grpc.clients needs them as separate properties.
quarkus.grpc.clients.inventory.host=${INVENTORY_HOST:inventory-quarkus}
quarkus.grpc.clients.inventory.port=${INVENTORY_PORT:50051}
quarkus.grpc.clients.inventory.plain-text=true
quarkus.grpc.clients.payment.host=${PAYMENT_HOST:payment-quarkus}
quarkus.grpc.clients.payment.port=${PAYMENT_PORT:50052}
quarkus.grpc.clients.payment.plain-text=true

# ── OpenTelemetry ───────────────────────────────────────────
# quarkus.otel.exporter.otlp.* does NOT fall back to the plain OTEL_* env var
# names on its own (that is an OTel SDK autoconfigure convention, not a
# SmallRye Config/Quarkus one) — it must be mapped explicitly, or the exporter
# defaults to localhost:4317/gRPC and traces/metrics/logs all silently fail to
# export. compose.yaml injects OTEL_EXPORTER_OTLP_ENDPOINT/_PROTOCOL; map them:
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://lgtm:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# ── Logging: trace_id/span_id correlation for Loki ─────────
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{3.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:logs}/order-quarkus.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{40}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."io.vertx.kafka".level=WARN
