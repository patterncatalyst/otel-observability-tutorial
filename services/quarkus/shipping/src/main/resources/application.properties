quarkus.application.name=shipping-quarkus

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=appuser
quarkus.datasource.password=apppass
quarkus.datasource.jdbc.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/appdb
# Emit OTel JDBC client spans for the Postgres hop (needs quarkus-opentelemetry
# on the classpath; no separate extension required).
quarkus.datasource.jdbc.telemetry=true

kafka.bootstrap.servers=${KAFKA_BOOTSTRAP:kafka:9094}

# Incoming order.placed: tracing stays on (default) so this consumer always
# creates its own span. When the order producer didn't inject a trace context
# (PROPAGATE_KAFKA_CONTEXT=false), that span starts a fresh/independent root
# trace instead of continuing the order's — i.e. the boundary visibly breaks.
mp.messaging.incoming.order-placed-in.connector=smallrye-kafka
mp.messaging.incoming.order-placed-in.topic=order.placed
mp.messaging.incoming.order-placed-in.group.id=shipping-quarkus
mp.messaging.incoming.order-placed-in.auto.offset.reset=earliest
mp.messaging.incoming.order-placed-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.order-placed-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.shipment-created-out.connector=smallrye-kafka
mp.messaging.outgoing.shipment-created-out.topic=shipment.created
mp.messaging.outgoing.shipment-created-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.shipment-created-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# Kafka trace-context propagation toggle (PROPAGATE_KAFKA_CONTEXT, default
# true): a runtime per-channel attribute, applied here for consistency with
# the order producer so shipment.created follows the same on/off behavior.
mp.messaging.outgoing.shipment-created-out.tracing-enabled=${PROPAGATE_KAFKA_CONTEXT:true}

# ── OpenTelemetry ───────────────────────────────────────────
# quarkus.otel.exporter.otlp.* does NOT fall back to the plain OTEL_* env var
# names on its own — it must be mapped explicitly, or the exporter defaults to
# localhost:4317/gRPC and traces/metrics/logs all silently fail to export.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://lgtm:4318}
quarkus.otel.exporter.otlp.protocol=${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
quarkus.otel.traces.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true

# ── Logging: trace_id/span_id correlation for Loki ─────────
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{3.}] (%t) %s%e%n
quarkus.log.file.enable=true
quarkus.log.file.path=${LOG_DIR:logs}/shipping-quarkus.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p traceId=%X{traceId}, spanId=%X{spanId}, sampled=%X{sampled} [%c{40}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=10M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.category."org.apache.kafka".level=WARN
quarkus.log.category."io.vertx.kafka".level=WARN
